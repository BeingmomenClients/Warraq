# هذا الملف مطلوب لبناء صورة Docker: بدونه لا تُبنى الثنائية الأصلية
# لحزمة sharp، فيسقط الخادم عند الإقلاع بخطأ sharp-linux-x64.node.
#
# الحقل packages يجعل المجلد مشروعاً مستقلاً صالحاً، فتعمل أوامر pnpm
# من داخل server/ مباشرة دون التعارض مع مساحة العمل في الجذر.
packages:
  - '.'

allowBuilds:
  sharp: true

onlyBuiltDependencies:
  - sharp
